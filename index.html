<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1a2b" />
    <meta
      name="description"
      content="Spaced-repetition flash cards to learn the faces and names of Texas Legislature members."
    />
    <title>Texas Legislature Flash Cards</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%BA%F0%9F%87%B8%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-flag" aria-hidden="true">★</span>
          <div class="brand-text">
            <h1>TX Leg Flash Cards</h1>
            <p class="tagline">SM-2 · swipe to grade</p>
          </div>
        </div>
        <div class="scoreboard" id="scoreboard" aria-live="polite">
          <div class="stat">
            <span class="stat-label">Due</span>
            <span class="stat-value" id="stat-due">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Learn</span>
            <span class="stat-value" id="stat-learning">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">New</span>
            <span class="stat-value" id="stat-new">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Mature</span>
            <span class="stat-value" id="stat-mature">0</span>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Study settings">
        <div class="segmented" role="group" aria-label="Chamber filter">
          <button type="button" class="seg active" data-chamber="all">All</button>
          <button type="button" class="seg" data-chamber="House">House</button>
          <button type="button" class="seg" data-chamber="Senate">Senate</button>
        </div>
        <button type="button" class="icon-btn" id="btn-reset" title="Reset SRS progress" aria-label="Reset SRS progress">
          ↺
        </button>
      </section>

      <!-- Card stage: never scrolls; card stays centered in remaining viewport -->
      <main class="stage" id="stage">
        <div class="loading" id="loading">Loading members…</div>
      </main>

      <footer class="footer" id="footer">
        <p class="footer-hint" id="footer-hint">
          Tap <strong>Flip</strong> · swipe ← missed · swipe → got it
        </p>
        <p class="footer-meta">
          <span id="data-meta"></span>
        </p>
      </footer>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
