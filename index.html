<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1628" />
    <meta
      name="description"
      content="Learn Texas legislators by face — multiple choice, spaced repetition, Capitol ranks."
    />
    <title>Who's Who · Texas Legislature</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%BA%F0%9F%87%B8%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="top">
        <button type="button" class="top-left top-hit" id="btn-leaderboard" title="Capitol leaderboard" aria-label="Open leaderboard">
          <span class="logo" aria-hidden="true">★</span>
          <span class="rank-line" id="hud-rank">🐣 Capitol Intern</span>
        </button>
        <div class="top-right" aria-live="polite">
          <span class="pill pill-xp" id="hud-xp" title="Total XP">0 XP</span>
          <span class="pill pill-streak" id="hud-streak" title="Day streak">0🔥</span>
          <span class="pill pill-combo" id="hud-combo" title="Combo">—</span>
          <span class="pill pill-left" id="stat-left" title="Cards left">— left</span>
        </div>
      </header>

      <main class="stage" id="stage" aria-label="Flash card quiz">
        <div class="boot">Loading…</div>
      </main>

      <nav class="dock dock-one" id="dock" aria-label="Card actions">
        <button type="button" class="dock-btn dont" id="btn-skip" disabled>
          <span class="dock-icon" aria-hidden="true">?</span>
          <span class="dock-label">Don't know / skip</span>
        </button>
      </nav>

      <div class="footer-bar">
        <p class="coach" id="coach">Pick the name that matches the face</p>
        <a
          class="kofi-link"
          href="https://ko-fi.com/poseyatx"
          target="_blank"
          rel="noopener noreferrer"
          title="Support on Ko-fi"
          >☕ Ko-fi</a
        >
      </div>
    </div>

    <div id="leaderboard-root" class="leaderboard-root" hidden></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
