<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1628" />
    <meta
      name="description"
      content="Learn Texas legislators by face. Tap to flip. Swipe if you knew them."
    />
    <title>Who's Who · Texas Legislature</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%BA%F0%9F%87%B8%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- Minimal chrome: one line of status, no clutter -->
      <header class="top">
        <div class="top-left">
          <span class="logo" aria-hidden="true">★</span>
          <span class="app-name">Who's Who</span>
        </div>
        <div class="top-right" aria-live="polite">
          <span class="pill" id="stat-left" title="Cards left in this session">— left</span>
        </div>
      </header>

      <!-- The only interactive surface: full remaining height, no scroll -->
      <main class="stage" id="stage" aria-label="Flash card">
        <div class="boot">Loading…</div>
      </main>

      <!-- Always-visible thumb bar: no hunting for buttons -->
      <nav class="dock" id="dock" aria-label="Grade card">
        <button type="button" class="dock-btn dont" id="btn-dont" disabled>
          <span class="dock-icon" aria-hidden="true">←</span>
          <span class="dock-label">Don't know</span>
        </button>
        <button type="button" class="dock-btn flip" id="btn-flip" disabled>
          <span class="dock-icon" aria-hidden="true">↻</span>
          <span class="dock-label">Show name</span>
        </button>
        <button type="button" class="dock-btn know" id="btn-know" disabled>
          <span class="dock-icon" aria-hidden="true">→</span>
          <span class="dock-label">Know them</span>
        </button>
      </nav>

      <p class="coach" id="coach">Tap the card · swipe right if you knew them · left if not</p>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
