<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Flash cards to learn the faces and names of members of the Texas Legislature (House & Senate)."
    />
    <title>Texas Legislature Flash Cards</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%BA%F0%9F%87%B8%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-flag" aria-hidden="true">★</span>
          <div>
            <h1>Texas Legislature Flash Cards</h1>
            <p class="tagline">Learn the faces of the 89th Legislature</p>
          </div>
        </div>
        <div class="scoreboard" id="scoreboard" aria-live="polite">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="stat-score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Streak</span>
            <span class="stat-value" id="stat-streak">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="stat-best">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Seen</span>
            <span class="stat-value" id="stat-seen">0</span>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Game settings">
        <div class="control-group">
          <span class="control-label">Chamber</span>
          <div class="segmented" role="group" aria-label="Chamber filter">
            <button type="button" class="seg active" data-chamber="all">All</button>
            <button type="button" class="seg" data-chamber="House">House</button>
            <button type="button" class="seg" data-chamber="Senate">Senate</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">Mode</span>
          <div class="segmented" role="group" aria-label="Quiz mode">
            <button type="button" class="seg active" data-mode="photo-to-name">Photo → Name</button>
            <button type="button" class="seg" data-mode="name-to-photo">Name → Photo</button>
            <button type="button" class="seg" data-mode="district">District → Name</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">Choices</span>
          <div class="segmented" role="group" aria-label="Number of choices">
            <button type="button" class="seg" data-choices="2">2</button>
            <button type="button" class="seg active" data-choices="4">4</button>
            <button type="button" class="seg" data-choices="6">6</button>
          </div>
        </div>
      </section>

      <main class="stage" id="stage">
        <div class="loading" id="loading">Loading members…</div>
      </main>

      <footer class="footer">
        <p>
          Member photos and names from the official
          <a href="https://house.texas.gov/members" target="_blank" rel="noopener">Texas House</a>
          and
          <a href="https://senate.texas.gov/members.php" target="_blank" rel="noopener">Texas Senate</a>
          member directories. For educational use.
        </p>
        <p class="footer-meta">
          <span id="data-meta"></span>
          ·
          <button type="button" class="linkish" id="btn-reset">Reset stats</button>
          ·
          <kbd>1</kbd>–<kbd>6</kbd> choose · <kbd>N</kbd> next · <kbd>Space</kbd> reveal
        </p>
      </footer>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
